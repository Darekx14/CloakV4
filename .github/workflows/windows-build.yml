name: Compile CloakV4 with Visual Studio
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install Dependencies via vcpkg
        run: |
          vcpkg integrate install
          vcpkg install luajit zlib curl openal-soft libvorbis libogg gmp jsoncpp sqlite3 --triplet x64-windows

      - name: Configure CMake with Precise Paths
        run: |
          mkdir build
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DRUN_IN_PLACE=TRUE `
            -DENABLE_SOUND=FALSE `
            -DENABLE_CURL=TRUE `
            -DENABLE_LUAJIT=TRUE `
            -DREQUIRE_LUAJIT=TRUE `
            -DENABLE_SYSTEM_JSONCPP=TRUE `
            ..

      - name: Build Project
        run: |
          cd build
          msbuild ALL_BUILD.vcxproj /p:Configuration=Release /p:Platform=x64 /p:BuildInParallel=true

      - name: Upload Finished Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloakV4-VS-Build
          path: |
            build/bin/Release/
            build/Release/
            build/bin/
